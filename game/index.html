<title>Solara Bay</title>
<style>

</style>

<canvas id="game" aria-label="Solara Bay: a 2D open-world crime game. Walk or drive around the city, steal cars, lose the cops, run jobs for Vince Kroll."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color: #f4f6f8; font-family: system-ui, sans-serif; padding: 2em;">Solara Bay needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
